name: Build Siba OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          CFG=$(find . -type f -path '*/auto/config' -not -path './.git/*' | head -1)
          if [ -z "$CFG" ]; then
            echo "auto/config not found. Repo contents:"
            find . -maxdepth 4 -not -path './.git/*' | head -80
            exit 1
          fi
          P=$(dirname "$(dirname "$CFG")")
          echo "Project folder: $P"
          echo "PROJECT=$P" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux isolinux \
            debian-archive-keyring curl gnupg wget
          wget -O /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          sudo apt-get install -y /tmp/live-build.deb
          lb --version

      - name: Make scripts executable
        run: |
          cd "$PROJECT"
          chmod +x auto/config auto/build auto/clean build-local.sh
          chmod +x config/hooks/live/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/*

      - name: Configure
        run: |
          cd "$PROJECT"
          sudo ./auto/config

      - name: Build ISO
        run: |
          cd "$PROJECT"
          sudo ./auto/build

      - name: Collect ISO
        run: |
          cd "$PROJECT"
          mkdir -p out
          sudo mv ./*.iso out/
          cd out
          sha256sum *.iso | tee SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: siba-os-iso
          path: ${{ env.PROJECT }}/out/*
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT }}/build.log
          if-no-files-found: ignore
