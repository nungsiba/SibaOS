<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:#121720;width:1280px;height:720px;overflow:hidden;font-family:Inter,Arial,sans-serif}
#c{position:absolute;left:0;right:0;top:0;bottom:0}
#logo{position:absolute;left:512px;top:150px;width:256px;height:256px}
#word{position:absolute;left:0;right:0;top:416px;text-align:center;font-size:56px;font-weight:600;color:#f2f5fa;letter-spacing:.5px}
#word span{font-weight:300;color:#aab4c6}
#track{position:absolute;left:520px;top:516px;width:240px;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
#fill{position:absolute;left:520px;top:516px;height:4px;border-radius:2px;background:#7aa2f0;width:10px}
#by{position:absolute;left:0;right:0;bottom:36px;text-align:center;color:#6f7a8e;font-size:16px;letter-spacing:2px}
</style>
<div id="c"><img id="logo" src="../config/includes.chroot/usr/share/plymouth/themes/siba/logo.png">
<div id="word">Siba <span>OS</span></div><div id="track"></div><div id="fill"></div>
<div id="by">BUILT BY SOROKHAIBAM NUNGSIBA SINGH</div></div>
<script>
const cl=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a)));
function seek(t){
  const lo=t<1?t:0.88+0.12*Math.sin((t-1)*3);
  document.getElementById('logo').style.opacity=lo;
  document.getElementById('logo').style.transform='scale('+(0.92+0.08*cl(t,0,1.2))+')';
  document.getElementById('word').style.opacity=cl(t,0.6,1.4);
  document.getElementById('track').style.opacity=cl(t,1.2,1.8);
  const f=document.getElementById('fill'); f.style.opacity=cl(t,1.2,1.8);
  const p=cl(t,1.4,4.6); const e=p*p*(3-2*p);
  f.style.width=(240*(0.04+0.96*e))+'px';
  document.getElementById('by').style.opacity=0.8*cl(t,1.6,2.4);
}
</script>
